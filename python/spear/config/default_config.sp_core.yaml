SP_CORE:

  # Wait for keyboard input during initialization, which can be useful when attempting to attach a debugger
  # to the running executable.
  WAIT_FOR_KEYBOARD_INPUT_DURING_INITIALIZATION: False

  # Initial ID to use when creating shared memory regions. Shared memory regions are assigned monotonically
  # increasing IDs when they are created. If there are multiple instances running on the same machine, each
  # instance needs a unique initial ID, such that no instance ever needs to use an ID that has is already
  # being used by another instance.
  SHARED_MEMORY_INITIAL_UNIQUE_ID: 0

  OUTPUT_LOG:
    # Mirror non-SPEAR-originating Unreal log messages to stdout by default (see StdOutputDevice::Serialize(...)
    # in SpCore/OutputLog.cpp). Set to False, or pass -sp-no-stdout on the command-line, to suppress this.
    ENABLE_STDOUT: True

    # Capture messages emitted via Unreal's logging system into an in-memory ring buffer, so they can be
    # retrieved later, e.g., to include in an error response sent back to a client that has no other way of
    # seeing the Unreal log.
    ENABLE_BUFFERED_OUTPUT_DEVICE: True
    BUFFERED_OUTPUT_DEVICE_NUM_MESSAGES: 8192

  # Verbose debug printing for the proxy component system.
  PROXY_COMPONENT_MANAGER:
    VERBOSE: False
  MESH_PROXY_COMPONENT_MANAGER:
    VERBOSE: False

  #
  # We allow the user to override the ini values in the project Config directory. These overrides must happen
  # very early in the application lifecycle because they can affect the initialization of engine systems that
  # can't be changed at runtime, e.g., which graphics API to use, etc. Each CONFIG_*_INI_STRING is interpreted as
  # Unreal INI text (section headers, key=value lines, and the +/-/./! array operators), exactly as if the text
  # had been appended to the corresponding default INI file. We recommend specifying these strings using YAML
  # block scalars, e.g.,
  #
  #   OVERRIDE_CONFIG_ENGINE_INI: True
  #   CONFIG_ENGINE_INI_STRING: |
  #     [/Script/Engine.RendererSettings]
  #     r.CustomDepth=3
  #

  OVERRIDE_CONFIG_DEVICE_PROFILES_INI: False
  OVERRIDE_CONFIG_ENGINE_INI: False
  OVERRIDE_CONFIG_GAME_INI: False
  OVERRIDE_CONFIG_GAMEPLAY_TAGS_INI: False
  OVERRIDE_CONFIG_GAME_USER_SETTINGS_INI: False
  OVERRIDE_CONFIG_HARDWARE_INI: False
  OVERRIDE_CONFIG_INPUT_INI: False
  OVERRIDE_CONFIG_INSTALL_BUNDLE_INI: False
  OVERRIDE_CONFIG_RUNTIME_OPTIONS_INI: False
  OVERRIDE_CONFIG_SCALABILITY_INI: False

  CONFIG_DEVICE_PROFILES_INI_STRING: ""
  CONFIG_ENGINE_INI_STRING: ""
  CONFIG_GAME_INI_STRING: ""
  CONFIG_GAMEPLAY_TAGS_INI_STRING: ""
  CONFIG_GAME_USER_SETTINGS_INI_STRING: ""
  CONFIG_HARDWARE_INI_STRING: ""
  CONFIG_INPUT_INI_STRING: ""
  CONFIG_INSTALL_BUNDLE_INI_STRING: ""
  CONFIG_RUNTIME_OPTIONS_INI_STRING: ""
  CONFIG_SCALABILITY_INI_STRING: ""

  # These INI files are only loaded in desktop builds. These overrides are ignored in other builds.

  OVERRIDE_CONFIG_COMPAT_INI: False
  OVERRIDE_CONFIG_LIGHTMASS_INI: False

  CONFIG_COMPAT_INI_STRING: ""
  CONFIG_LIGHTMASS_INI_STRING: ""

  # These INI files are only loaded in editor builds. These overrides are ignored in other builds.

  OVERRIDE_CONFIG_EDITOR_INI: False
  OVERRIDE_CONFIG_EDITOR_KEY_BINDINGS_INI: False
  OVERRIDE_CONFIG_EDITOR_LAYOUT_INI: False
  OVERRIDE_CONFIG_EDITOR_PER_PROJECT_INI: False
  OVERRIDE_CONFIG_EDITOR_SETTINGS_INI: False

  CONFIG_EDITOR_INI_STRING: ""
  CONFIG_EDITOR_KEY_BINDINGS_INI_STRING: ""
  CONFIG_EDITOR_LAYOUT_INI_STRING: ""
  CONFIG_EDITOR_PER_PROJECT_INI_STRING: ""
  CONFIG_EDITOR_SETTINGS_INI_STRING: ""
