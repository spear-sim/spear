name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs_paths
      - "**/*.md"
      - "**/*.mdc"
      - "docs/**"
      - "LICENSE.txt"
      - "ACKNOWLEDGMENTS.txt"
  pull_request:
    paths-ignore: *docs_paths
  workflow_dispatch:

jobs:

  # Pure static analysis. Results don't depend on OS, so this only needs to run once.
  lint-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Lint all Python source code"
        run: |
          pip install ruff==0.15.22
          ruff check \
            --target-version py311 \
            --select F,PLE \
            --ignore F401,F403,F541,F841 \
            python tools pipeline editor examples python_ext/python

  test-vtk-and-mayavi:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install VTK and Mayavi"
        run: |
          pip install vtk==9.3.1
          pip install --no-build-isolation mayavi==4.8.3

  # Verify the spear Python package actually installs and imports on each platform.
  install-python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Install the spear Python package (with optional components [examples,pipeline])"
        run: |
          pip install -e python[examples,pipeline]

      - name: "Import spear"
        run: python -c "import spear; spear.log('spear imported successfully (spear.__can_import_spear_ext__ = ', spear.__can_import_spear_ext__, ')')"

  # Compile the spear_ext Python extension module and its dependent third-party libraries
  # using the system compiler. We intentionally exclude Linux, because our build scripts source
  # clang/libc++ from an Unreal Engine install on Linux.
  install-spear-ext:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-26]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4

      # install_python_extension.py requires an activated conda environment (see
      # docs/getting_started.md), so we set one up rather than using actions/setup-python.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          activate-environment: spear-env

      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: "Check out rpclib"
        run: git submodule update --init third_party/rpclib

      - name: "Install the spear Python package"
        run: pip install -e python

      - name: "Build third-party libraries"
        run: python tools/build_third_party_libs.py --skip-boost --skip-yamlcpp

      - name: "Build and install the spear_ext Python extension module"
        run: python tools/install_python_extension.py --conda-script "$CONDA/etc/profile.d/conda.sh"

      - name: "Import spear_ext"
        run: python -c "import spear; import spear_ext; spear.log('spear_ext imported successfully')"
